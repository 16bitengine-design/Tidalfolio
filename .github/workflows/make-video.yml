name: Make tidalfolio video

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script file name inside scripts/ (leave blank to render the next one in queue.txt)"
        required: false
        default: ""
  # Scheduled runs are OFF: the puppet workflow (make-puppet-video.yml) runs daily instead.
  # To turn this one back on, add:  schedule: [{cron: "0 5 * * 1,3,5"}]   (Mon/Wed/Fri 05:00 UTC)

permissions:
  contents: write
  issues: write      # lets the alert step open an issue when something fails

# Only one run at a time, so two runs never race to push the queue.
concurrency:
  group: tidalfolio-push
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Collect results of earlier videos and update insights
        # Never blocks a video: if YouTube stats cannot be read this just prints why.
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python tools/collect_metrics.py
          python tools/make_insights.py

      - name: Write a new script if the queue is empty
        id: script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL }}
          PUNCH_UP: ${{ vars.PUNCH_UP || '1' }}
          SCRIPT_INPUT: ${{ inputs.script }}
        run: |
          if [ -z "$SCRIPT_INPUT" ] && [ -n "$OPENAI_API_KEY" ]; then
            python generate_script.py --ensure 1
          fi

      - name: Render video
        id: render
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TTS_MODEL: ${{ vars.OPENAI_TTS_MODEL }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          FAL_IMAGE_MODEL: ${{ vars.FAL_IMAGE_MODEL }}
          MUSIC_GENERATE: ${{ vars.MUSIC_GENERATE || '1' }}   # 0 = never generate music; use assets/music/ only
          SCRIPT_INPUT: ${{ inputs.script }}
        run: |
          if [ -n "$SCRIPT_INPUT" ]; then
            python pipeline.py "scripts/$SCRIPT_INPUT"
          else
            python pipeline.py --next
          fi

      - name: Post to TikTok via Buffer
        id: tiktok
        # A failure here must not lose the video: the artifact step below still runs.
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
        run: python post_tiktok.py

      - name: Post to YouTube via Buffer
        id: ytbuffer
        # YouTube is posted only through Buffer (no Google token needed).
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ vars.BUFFER_YOUTUBE_CHANNEL_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
          UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY || 'private' }}
          YT_AI_DISCLOSURE: ${{ vars.YT_AI_DISCLOSURE }}
        run: python post_youtube_buffer.py

      - name: Save finished videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidalfolio-videos
          path: |
            output/**/video.mp4
            output/**/thumbnail.png
            output/**/captions.srt
            output/**/metadata.md
            output/**/youtube_url.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Mark queue item as done
        run: |
          git config user.name "tidalfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add done.txt queue.txt scripts
          for f in metrics insights.md; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Update queue and scripts"

          # Resolve a conflicted rebase. Retrying the same rebase can never fix a content conflict, so:
          #  - metrics/videos.json is an append-only log: keep the rows from both sides (tools/merge_metrics.py)
          #  - insights.md is generated from videos.json: take origin's copy, it is rebuilt right after
          #  - anything else: stop and say so, rather than guess
          resolve_rebase() {
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                metrics/videos.json) python tools/merge_metrics.py "$f" || return 1 ;;
                insights.md) git checkout --ours -- "$f" ;;   # during a rebase, "ours" = origin/main
                *) echo "Unresolvable conflict in $f" >&2; return 1 ;;
              esac
              git add "$f"
            done
            GIT_EDITOR=true git rebase --continue
          }

          # Remote may have moved while this run was rendering: rebase onto it, retry on a race.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main || { resolve_rebase; }; then
              # insights.md is derived from videos.json: rebuild it so it matches the merged log
              python tools/make_insights.py || true
              git add insights.md 2>/dev/null || true
              git diff --cached --quiet || git commit -m "Refresh insights"
              git push origin HEAD:main && exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done
          echo "Could not push after 5 attempts" >&2
          exit 1

      - name: Alert me if anything failed
        # Runs when any step failed, including TikTok (which is allowed to fail without stopping the run).
        # GitHub emails you about every new issue, and the GitHub mobile app pushes it to your phone.
        if: always() && (failure() || steps.tiktok.outcome == 'failure' || steps.ytbuffer.outcome == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_SCRIPT: ${{ steps.script.outcome }}
          R_RENDER: ${{ steps.render.outcome }}
          R_TIKTOK: ${{ steps.tiktok.outcome }}
          R_YTBUFFER: ${{ steps.ytbuffer.outcome }}
        run: |
          body="A tidalfolio run did not finish cleanly.

          | Step | Result |
          |---|---|
          | Write script | $R_SCRIPT |
          | Render video | $R_RENDER |
          | Post to TikTok | $R_TIKTOK |
          | Post to YouTube via Buffer | $R_YTBUFFER |

          Run and logs: $RUN_URL
          If the video was rendered, download it from the run's tidalfolio-videos artifact and post it by hand."
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Tidalfolio run failed ($(date -u "+%Y-%m-%d %H:%M") UTC)" --body "$body"
