name: Make puppet video (code-drawn, free)

# Renders a storybook ink-and-paper animation with a free offline narrator. No fal.ai or OpenAI cost.
# Runs by itself every day: writes a new story if the queue is empty (needs the OPENAI_API_KEY secret), renders the
# next script in queue-puppet.txt and uploads it. Or by hand:
# Actions tab > "Make puppet video (code-drawn, free)" > Run workflow.
on:
  schedule:
    - cron: "0 15 * * *"      # daily, 15:00 UTC (18:00 Kampala)
  workflow_dispatch:
    inputs:
      script:
        description: "Puppet script file name inside scripts/ (leave blank to render the next one in queue-puppet.txt)"
        required: false
        default: ""
      upload:
        description: "Upload to YouTube after rendering (needs the YT_* secrets; privacy comes from the UPLOAD_PRIVACY variable)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: tidalfolio-push
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: puppet/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libfontconfig1 libgl1

      - name: Install Python packages
        run: pip install -r puppet/requirements.txt -r requirements.txt

      - name: Cache the narrator voice model (about 350 MB, downloaded once)
        uses: actions/cache@v4
        with:
          path: ~/.cache/tidalfolio/kokoro
          key: kokoro-v1.0-model-files

      - name: Learn from how earlier videos performed (the channel improves itself)
        # Reads views and watch-time of past uploads and writes insights.md, which the story writer reads.
        # Never blocks a video: without the read permissions on the YouTube token it just prints why.
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python tools/collect_metrics.py
          python tools/make_insights.py

      - name: Write a new story if the queue is empty (AI writes it, code checks it)
        if: ${{ inputs.script == '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not set: no new story will be written (the queue is used as it is)."
          else
            python puppet_story.py --ensure 1
          fi

      - name: Render video
        id: render
        env:
          SCRIPT_INPUT: ${{ inputs.script }}
        run: |
          if [ -n "$SCRIPT_INPUT" ]; then
            python puppet_render.py "scripts/$SCRIPT_INPUT"
          else
            python puppet_render.py --next
          fi

      - name: Post to TikTok via Buffer
        id: tiktok
        if: ${{ github.event_name == 'schedule' || inputs.upload }}
        # A failure here must not lose the video: the artifact step below still runs.
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
        run: python post_tiktok.py

      - name: Post to YouTube via Buffer
        id: ytbuffer
        if: ${{ github.event_name == 'schedule' || inputs.upload }}
        # YouTube is posted only through Buffer (no Google token needed).
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ vars.BUFFER_YOUTUBE_CHANNEL_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
          UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY || 'private' }}
          YT_AI_DISCLOSURE: ${{ vars.YT_AI_DISCLOSURE }}
        run: python post_youtube_buffer.py

      - name: Save finished videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidalfolio-puppet-videos
          path: |
            output/**/video.mp4
            output/**/thumbnail.png
            output/**/captions.srt
            output/**/metadata.md
            output/**/youtube_url.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Mark queue item as done
        if: ${{ inputs.script == '' }}
        run: |
          git config user.name "tidalfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add done-puppet.txt queue-puppet.txt scripts ideas.txt
          for f in metrics insights.md; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Update puppet queue"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done
          echo "Could not push after 5 attempts" >&2
          exit 1

      - name: Alert me if anything failed
        if: always() && (failure() || steps.tiktok.outcome == 'failure' || steps.ytbuffer.outcome == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Puppet video run failed ($(date -u "+%Y-%m-%d %H:%M") UTC)" \
            --body "A puppet video run did not finish. Logs: $RUN_URL"
