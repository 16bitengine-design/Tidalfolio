<!doctype html><meta charset="utf-8"><title>lego</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";
const W = +new URLSearchParams(location.search).get("w") || 540, H = +new URLSearchParams(location.search).get("h") || 960;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 200);

const plastic = (c, r = 0.32) => new THREE.MeshStandardMaterial({color: c, roughness: r, metalness: 0.0});
const studGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 20);

function brickBox(w, h, d, color, studs = true, parent = scene) {
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), plastic(color));
  m.castShadow = m.receiveShadow = true; g.add(m);
  if (studs) {
    const mat = plastic(color);
    const inst = new THREE.InstancedMesh(studGeo, mat, Math.ceil(w) * Math.ceil(d));
    let n = 0;
    for (let i = 0; i < Math.round(w); i++) for (let j = 0; j < Math.round(d); j++) {
      const o = new THREE.Object3D(); o.position.set(-w / 2 + 0.5 + i, h / 2 + 0.1, -d / 2 + 0.5 + j); o.updateMatrix(); inst.setMatrixAt(n++, o.matrix);
    }
    inst.count = n; inst.castShadow = true; g.add(inst);
  }
  parent.add(g); return g;
}

// ---------------- the room, built of bricks
function room(spec) {
  const floor = brickBox(26, 0.6, 22, spec.floor, true); floor.position.set(0, -0.3, 0);
  const wall = brickBox(26, 16, 1, spec.wall, false); wall.position.set(0, 8, -11.5);
  for (let i = 0; i < 16; i += 1) {                       // brick courses
    const line = new THREE.Mesh(new THREE.BoxGeometry(26.02, 0.06, 1.02), plastic(0x000000, 1)); line.material.transparent = true; line.material.opacity = 0.18; line.position.set(0, i + 0.0, -11.5); scene.add(line);
  }
  const side = brickBox(1, 16, 22, spec.wall, false); side.position.set(-13.5, 8, 0);
  // a window (frame + glowing pane)
  const frame = brickBox(6.4, 7.4, 0.6, 0xf4f4f4, false); frame.position.set(5, 9, -10.8);
  const pane = new THREE.Mesh(new THREE.BoxGeometry(5.6, 6.6, 0.3), new THREE.MeshStandardMaterial({color: spec.sky, emissive: spec.sky, emissiveIntensity: 0.9})); pane.position.set(5, 9, -10.5); scene.add(pane);
  // props: a table with a lamp, a plant
  const table = brickBox(6, 0.8, 3, 0x8a5a36, true); table.position.set(-7, 3.4, -7);
  for (const [x, z] of [[-9.5, -8.2], [-4.5, -8.2], [-9.5, -5.8], [-4.5, -5.8]]) { const leg = brickBox(0.8, 3, 0.8, 0x6e4526, false); leg.position.set(x, 1.5, z); }
  const base = brickBox(1.4, 0.5, 1.4, 0xffffff, false); base.position.set(-8, 4.05, -7);
  const lamp = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 1.0, 1.4, 24), new THREE.MeshStandardMaterial({color: 0xffe08a, emissive: 0xffc94d, emissiveIntensity: 1.2})); lamp.position.set(-8, 5.1, -7); scene.add(lamp);
  const lampLight = new THREE.PointLight(0xffc860, 40, 14, 1.6); lampLight.position.set(-8, 5.3, -6.5); scene.add(lampLight);
  const pot = brickBox(1.6, 1.4, 1.6, 0xc4553a, false); pot.position.set(10, 0.7, -8.5);
  for (let i = 0; i < 6; i++) { const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.9, 16, 12), plastic(0x2f9e4f)); leaf.scale.set(1, 1.6, 0.5); leaf.position.set(10 + Math.cos(i) * 0.9, 2.8 + (i % 3) * 0.5, -8.5 + Math.sin(i) * 0.6); leaf.rotation.z = Math.cos(i) * 0.5; leaf.castShadow = true; scene.add(leaf); }
}

// ---------------- the minifigure
function faceTexture(mood) {
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
  g.lineCap = "round"; g.strokeStyle = "#1b1622"; g.fillStyle = "#1b1622"; g.lineWidth = 12;
  const eye = (x) => { if (mood === "happy") { g.beginPath(); g.arc(x, 112, 16, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); } else if (mood === "sleepy") { g.beginPath(); g.arc(x, 104, 16, Math.PI * 0.1, Math.PI * 0.9); g.stroke(); } else { g.beginPath(); g.arc(x, 112, mood === "shocked" ? 15 : 11, 0, 7); g.fill(); } };
  eye(88); eye(168);
  g.lineWidth = 10;
  if (mood === "angry") { g.beginPath(); g.moveTo(60, 70); g.lineTo(108, 92); g.moveTo(196, 70); g.lineTo(148, 92); g.stroke(); }
  if (mood === "sad") { g.beginPath(); g.moveTo(64, 92); g.lineTo(108, 74); g.moveTo(192, 92); g.lineTo(148, 74); g.stroke(); }
  if (mood === "shocked") { g.beginPath(); g.ellipse(128, 186, 20, 28, 0, 0, 7); g.fill(); }
  else if (mood === "sad") { g.beginPath(); g.arc(128, 208, 30, Math.PI * 1.15, Math.PI * 1.85); g.stroke(); }
  else if (mood === "angry") { g.beginPath(); g.moveTo(96, 190); g.lineTo(160, 190); g.stroke(); }
  else { g.beginPath(); g.arc(128, 150, 46, Math.PI * 0.12, Math.PI * 0.88); g.stroke(); }
  return new THREE.CanvasTexture(c);
}

function hat(kind, color, color2) {
  const g = new THREE.Group();
  if (kind === "cap") {
    const dome = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 14, 0, 7, 0, Math.PI / 2), plastic(color)); dome.scale.set(1, 0.9, 1); g.add(dome);
    const bill = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.07, 0.5), plastic(color)); bill.position.set(0, 0.03, 0.55); g.add(bill);
  } else if (kind === "chef") {
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.25, 24), plastic(0xffffff)); band.position.y = 0.12; g.add(band);
    const puff = new THREE.Mesh(new THREE.SphereGeometry(0.62, 24, 16), plastic(0xffffff)); puff.scale.set(1, 0.85, 1); puff.position.y = 0.65; g.add(puff);
  } else if (kind === "straw") {
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 0.06, 32), plastic(color)); brim.position.y = 0.05; g.add(brim);
    const top = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.5, 0.4, 24), plastic(color)); top.position.y = 0.25; g.add(top);
    const ribbon = new THREE.Mesh(new THREE.CylinderGeometry(0.51, 0.51, 0.1, 24), plastic(color2)); ribbon.position.y = 0.12; g.add(ribbon);
  } else if (kind === "crown") {
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.5, 0.22, 24), plastic(0xf6c700, 0.2)); ring.position.y = 0.11; g.add(ring);
    for (let i = 0; i < 5; i++) { const t = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.3, 8), plastic(0xf6c700, 0.2)); const a = i / 5 * Math.PI * 2; t.position.set(Math.cos(a) * 0.4, 0.34, Math.sin(a) * 0.4); g.add(t); }
  } else if (kind === "helmet") {
    const dome = new THREE.Mesh(new THREE.SphereGeometry(0.56, 24, 16, 0, 7, 0, Math.PI / 2), plastic(color)); g.add(dome);
  }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}

function minifig(spec) {
  const root = new THREE.Group(); const skin = plastic(spec.skin, 0.28);
  const legs = new THREE.Group(); root.add(legs);
  const hips = new THREE.Mesh(new THREE.BoxGeometry(1.12, 0.35, 0.6), plastic(spec.legs)); hips.position.y = 1.55; hips.castShadow = true; legs.add(hips);
  for (const sx of [-0.28, 0.28]) { const l = new THREE.Mesh(new THREE.BoxGeometry(0.54, 1.4, 0.58), plastic(spec.legs)); l.position.set(sx, 0.85, 0); l.castShadow = true; legs.add(l);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.18, 0.78), plastic(spec.legs)); foot.position.set(sx, 0.09, 0.08); legs.add(foot); }
  const torso = new THREE.Group(); torso.position.y = 1.75; root.add(torso);
  const tb = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.35, 0.62), plastic(spec.torso)); tb.position.y = 0.68; tb.castShadow = true; torso.add(tb);
  if (spec.apron) { const a = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.05, 0.05), plastic(spec.apron)); a.position.set(0, 0.55, 0.34); torso.add(a); }
  if (spec.bib) { const a = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.05), plastic(spec.bib)); a.position.set(0, 0.55, 0.34); torso.add(a);
    for (const sx of [-0.3, 0.3]) { const s = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.7, 0.05), plastic(spec.bib)); s.position.set(sx, 1.05, 0.34); torso.add(s); } }
  if (spec.tie) { const t = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.05), plastic(spec.tie)); t.position.set(0, 0.7, 0.34); torso.add(t); }
  const arms = [];
  for (const sx of [-1, 1]) {
    const pivot = new THREE.Group(); pivot.position.set(sx * 0.72, 1.2, 0); torso.add(pivot);
    const a = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.0, 0.34), plastic(spec.sleeve || spec.torso)); a.position.y = -0.48; a.castShadow = true; pivot.add(a);
    const hand = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.3, 14), skin); hand.rotation.z = Math.PI / 2; hand.position.y = -1.08; hand.castShadow = true; pivot.add(hand);
    arms.push(pivot);
  }
  const head = new THREE.Group(); head.position.y = 3.15; root.add(head);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.12, 14), skin); neck.position.y = -0.05; head.add(neck);
  const hm = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.52, 0.62, 32), skin); hm.position.y = 0.34; hm.castShadow = true; head.add(hm);
  const stud = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.14, 20), skin); stud.position.y = 0.72; head.add(stud);
  const face = new THREE.Mesh(new THREE.CircleGeometry(0.44, 32), new THREE.MeshBasicMaterial({map: faceTexture(spec.mood), transparent: true})); face.position.set(0, 0.34, 0.526); head.add(face);
  if (spec.hat) { const h = hat(spec.hat, spec.hatColor, spec.hatColor2); h.position.y = 0.62; head.add(h); }
  if (spec.hair) { const hr = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 16, 0, 7, 0, Math.PI / 1.7), plastic(spec.hair)); hr.position.y = 0.4; hr.rotation.x = -0.25; head.add(hr); }
  root.userData = {arms, head, torso, legs, spec}; root.scale.setScalar(1.55);
  return root;
}

// ---------------- the shot
let fig, scn;
window.setup = (spec) => {
  scene.clear();
  scene.background = new THREE.Color(spec.bg);
  scene.fog = new THREE.Fog(spec.bg, 40, 90);
  scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x80664a, 0.9));
  const sun = new THREE.DirectionalLight(0xfff0d8, 2.2); sun.position.set(-9, 20, 14); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 70}); sun.shadow.bias = -0.0004; scene.add(sun);
  const rim = new THREE.DirectionalLight(0x9db8ff, 1.1); rim.position.set(12, 8, -10); scene.add(rim);
  room(spec.room);
  fig = minifig(spec.fig); fig.position.set(0, 0, 0); scene.add(fig);
  window.frame(0);
};
window.frame = (t) => {
  const ud = fig.userData, a = fig.userData.spec.action || "stand";
  ud.head.rotation.z = Math.sin(t * 2.2) * 0.06; ud.head.rotation.y = Math.sin(t * 1.3) * 0.18;
  ud.torso.rotation.y = Math.sin(t * 1.1) * 0.05;
  fig.position.y = a === "cheer" ? Math.abs(Math.sin(t * 5)) * 0.6 : 0;
  let L = 0.1, R = -0.1, Lz = 0.12, Rz = -0.12;
  if (a === "cheer") { L = Math.PI; R = Math.PI; Lz = -0.5 + Math.sin(t * 8) * 0.2; Rz = 0.5 - Math.sin(t * 8) * 0.2; }
  if (a === "wave") { R = Math.PI * 0.95; Rz = -0.6 + Math.sin(t * 8) * 0.35; }
  if (a === "talk") { R = Math.PI * 0.45 + Math.sin(t * 4) * 0.3; Rz = -0.25; }
  ud.arms[0].rotation.set(L, 0, Lz); ud.arms[1].rotation.set(R, 0, Rz);
  const p = Math.min(1, t / 3);
  camera.position.set(Math.sin(t * 0.4) * 1.2, 6.2 - p * 0.4, 20 - p * 2.2); camera.lookAt(0, 4.6, 0);
  renderer.render(scene, camera);
  return true;
};
window.ready = true;
</script>
